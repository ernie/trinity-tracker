// trinity.cfg: the cvars Trinity requires, plus recommended ones.
// Written by `trinity init`. autoexec.cfg runs it for every game server
// on this host.

// --- REQUIRED ----------------------------------------------------------
set g_logSync          1   // write log lines immediately so the collector sees them live
set g_trinityHandshake 1   // the hub drops match stats without this
set sv_conTap          1   // console tap for trinity console (port via sv_conPort)
// rconpassword is set in each game type's cfg (ffa.cfg, 1v1.cfg, …),
// which only root and the service user can read.

// --- ENGINE / NETWORK --------------------------------------------------
set sv_fps             40
set com_hunkmegs       256
set sv_maxrate         50000
set sv_pure            0
set logfile            0
set g_unlagged         1
set com_writeConfig    0   // the servers share a home path, so a written
                           // q3config_server.cfg would leak archived cvars
                           // from one server into the others

// --- MASTER SERVER -----------------------------------------------------
set dedicated          2   // 2 = announce to master server
set sv_master1         "directory.trinity.run"
set sv_master2         ""
set sv_master3         ""
set sv_master4         ""
set sv_master5         ""

// --- DOWNLOADS (required to join the hub network) ----------------------
set sv_allowDownload   9   // HTTP downloads that keep the player connected
set sv_dlRate          500

// --- TRINITYVISION (required to join the hub network) ------------------
set sv_tvAuto                  1
set sv_tvpath                  "demos"
set sv_tvLive                  1   // broadcast the in-progress match

// --- RECOMMENDED (tune to your setup) -----------------------------------
set sv_tvAutoMinPlayers        1   // discard bot-only recordings…
set sv_tvAutoMinPlayersSecs    60  // …unless a human played ≥ 60s

// --- GAME MODE --------------------------------------------------------
// Movement physics and combat rules.
set g_mode             0   // 0 Quake III Arena, 1 CPMA, 2 Quake Live, 3 Quake Live Turbo

// --- MATCH FLOW (per-mode cfgs may override) ---------------------------
set g_doWarmup         1
set g_warmup           20
set g_inactivity       120
set g_weaponrespawn    5
set g_forcerespawn     3
set g_allowvote        1
set g_motd             "{{motd_host}}"

// --- TEAM PLAY ---------------------------------------------------------
// Team names must be Team Arena clans (Crusaders, Intruders, Pagans,
// Stroggs, The Fallen), or clan rosters and g_clanRotation turn off.
set g_redteam          "Crusaders"
set g_blueteam         "Pagans"
set g_clanRotation     1   // winner stays: the losing clan rotates out (Team Arena only)

// --- PASSWORD VISIBILITY (advertised in serverinfo via `sets`) ---------
sets g_needpass        0
sets g_password        ""

// --- BOTS --------------------------------------------------------------
set bot_enable                 1
set bot_nochat                 1
set g_spskill                  4   // bot skill, 1 (I Can Win) to 5 (Nightmare!)
set g_skipBotFiles             1   // ignore .bot files in loaded pk3s

// --- FAST DOWNLOAD (required to join the hub network) ------------------
// The nginx dl.<host> vhost serves missing pk3s and .tvd recordings.
{{fastdl_block}}
