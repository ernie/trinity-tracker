// {{stem}}.cfg: Free For All.
// Every game server of this game type on the host runs this file; each
// server's .env file loads it with +exec {{stem}}.cfg.
// The cvars Trinity requires are in trinity.cfg, which autoexec.cfg runs.

set rconpassword       "{{rcon_password}}"
set sv_hostname        "{{hostname}}"
set g_gametype         0
set fraglimit          20
set timelimit          15
set g_overtimelimit    3
set sv_maxclients      12
set bot_minplayers     4
set g_autoJoin         1

// Map cycle is in rotation.{{stem}} (alongside this file).
set g_rotation         "rotation.{{stem}}"

// Starting map: keep it the same as the first map in rotation.{{stem}}.
map q3dm6
